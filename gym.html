<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헬스 기록</title>
<meta name="theme-color" content="#0B0C0E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0C0E'/%3E%3Cpath d='M14 32h4M46 32h4M22 22v20M42 22v20M22 32h20' stroke='%23C8FF3D' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
/* ── 토큰 — Gym Log App.dc.html / 1e 스타일 가이드 그대로 ── */
:root{
  --bg:#0B0C0E; --surface:#15171A; --surface-2:#1D2024; --surface-3:#22262B;
  --line:#262A2F; --line-2:#21252A; --line-3:#1E2226;
  --accent:#C8FF3D; --accent-dim:#7C9A2C; --accent-deep:#4A5A28; --accent-deepest:#3A4620;
  --text:#F2F4F5; --text-2:#B6BCC2; --muted:#8A9199; --dim:#6E767E; --dimmer:#5A6169;
  --f:Archivo,'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --fk:'Noto Sans KR',Archivo,system-ui,sans-serif;
  --pad:20px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--f);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
}
button,input,select{font-family:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
.num{font-variant-numeric:tabular-nums}

/* ── 셸 ── */
.app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.scr{
  flex:1;min-height:0;display:none;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 104px;
}
.scr.on{display:flex}
.shd{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 4px 0;gap:12px}
.stitle{font:800 28px/1.1 var(--f);letter-spacing:-.03em}
.lbl{font:600 10.5px/1.2 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:20px}
.card.hi{background:linear-gradient(180deg,#181B15,#15171A);border-color:#2B3320}

/* ── 탭바 ── */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:430px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(11,12,14,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-2);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font:600 10px var(--fk);color:var(--dim);height:84px;position:relative;
}
.tab[aria-selected="true"]{color:var(--accent)}
.tab svg{width:22px;height:22px}
.tab .live{
  position:absolute;top:16px;right:calc(50% - 20px);
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:blip 1.4s infinite;
}

/* ── 버튼 ── */
.btn{
  height:56px;border-radius:16px;background:var(--accent);color:#0B0C0E;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font:700 17px var(--fk);letter-spacing:-.01em;width:100%;
}
.btn:active{transform:scale(.985)}
.btn.sm{height:48px;border-radius:14px;font-size:15px}
.btn2{
  height:48px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);
  color:var(--text-2);display:flex;align-items:center;justify-content:center;
  font:600 14px var(--fk);width:100%;
}
.btn2.tall{height:56px;border-radius:16px;font-size:15px}
.btn3{
  height:56px;border-radius:16px;border:1px dashed #33383E;color:var(--dim);
  display:flex;align-items:center;justify-content:center;font:600 14px var(--fk);width:100%;
}
.sq{
  width:48px;height:48px;border-radius:15px;background:var(--surface-3);flex:none;
  display:flex;align-items:center;justify-content:center;font:700 13px var(--f);color:var(--text);
}
.icobtn{
  width:44px;height:44px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.icobtn.solid{background:var(--surface-3);border-color:transparent}
.pill{
  height:36px;padding:0 16px;border-radius:12px;background:var(--surface-2);color:var(--muted);
  display:inline-flex;align-items:center;font:600 13px var(--fk);white-space:nowrap;
}
.pill[aria-selected="true"]{background:var(--accent);color:#0B0C0E;font-weight:700}
.pillrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pillrow::-webkit-scrollbar{display:none}

/* ── 홈 ── */
.greet{font:700 26px/1.2 var(--fk);letter-spacing:-.02em;margin-top:6px}
.streak{padding:22px 24px;display:flex;align-items:center;gap:22px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font:800 34px var(--f);color:var(--accent);font-variant-numeric:tabular-nums}
.ring .u{font:600 9.5px var(--fk);color:var(--muted);margin-top:-2px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:#2A2F35;display:block}
.dots i.on{background:var(--accent)}
.rname{font:800 30px/1.1 var(--f);letter-spacing:-.03em}
.rname s{text-decoration:none;color:var(--dimmer);font-weight:600;font-size:20px}
.exrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-3)}
.exrow:last-child{border-bottom:none}
.exrow .i{font:400 12px var(--f);color:var(--dimmer);width:16px;font-variant-numeric:tabular-nums}
.exrow .n{font:500 14px var(--fk);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exrow .s{font:400 13px var(--f);color:var(--muted);font-variant-numeric:tabular-nums}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:46px}
.wk div{display:flex;flex-direction:column;gap:6px;align-items:center;height:100%;justify-content:flex-end}
.wk span.b{width:100%;background:#2A2F35;border-radius:5px;display:block;min-height:6px}
.wk span.b.on{background:var(--accent)}
.wk span.d{font:400 10px var(--f);color:var(--dim)}

/* ── 기록(세션) ── */
.timer{font:800 40px/1.05 var(--f);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.rest{padding:16px 20px;display:flex;align-items:center;gap:18px;transition:border-color .2s,background .2s}
.rest .t{font:800 44px/1.05 var(--f);font-variant-numeric:tabular-nums}
.rest[data-on="1"]{border-color:var(--accent);background:rgba(200,255,61,.07)}
.rest[data-on="1"] .t,.rest[data-on="1"] .lbl{color:var(--accent)}
.rest[data-on="0"] .t{color:var(--dimmer)}
.blip{animation:blip 1.4s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.excard{padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px}
.exhd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.exhd .n{font:700 17px var(--fk);letter-spacing:-.01em}
.bar{height:3px;background:#23272C;border-radius:2px;overflow:hidden}
.bar i{display:block;height:3px;background:var(--accent);border-radius:2px;transition:width .3s}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{
  height:56px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;
  border:1px solid var(--line);background:var(--surface);width:100%;text-align:left;
  transition:background .15s,border-color .15s;
}
.setrow .no{font:700 12px var(--f);width:22px;flex:none;color:var(--dimmer);font-variant-numeric:tabular-nums}
.setrow .v{font:800 26px var(--f);letter-spacing:-.03em;color:var(--muted);font-variant-numeric:tabular-nums}
.setrow .u{font:600 12px var(--f);color:var(--dim);margin-left:-6px}
.setrow .x{color:#3A4046;font-size:14px}
.setrow .chip{
  width:36px;height:36px;border-radius:12px;border:1.5px solid #33383E;flex:none;
  display:flex;align-items:center;justify-content:center;margin-left:auto;
}
.setrow .chip svg{stroke:transparent}
.setrow[data-st="active"]{border:1.5px solid var(--accent);background:rgba(200,255,61,.07)}
.setrow[data-st="active"] .no{color:var(--accent)}
.setrow[data-st="active"] .v{color:var(--text)}
.setrow[data-st="active"] .chip{border-color:var(--accent)}
.setrow[data-st="done"]{border-color:rgba(200,255,61,.22);background:#161A10}
.setrow[data-st="done"] .no{color:var(--accent-dim)}
.setrow[data-st="done"] .v{color:var(--accent)}
.setrow[data-st="done"] .chip{background:var(--accent);border-color:var(--accent)}
.setrow[data-st="done"] .chip svg{stroke:#0B0C0E}
.setrow .edit{
  flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:14px;
  text-align:left;border-radius:14px 0 0 14px;
}
.setrow .edit:active{opacity:.6}
.sesfoot{display:flex;gap:10px;padding-bottom:6px}
.sesfoot .btn{flex:1.4}
.sesfoot .btn2{flex:1}

/* ── 루틴 ── */
.rcard{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.rmeta{display:flex;gap:22px}
.rmeta .v{font:800 22px var(--f);margin-top:3px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{padding:7px 12px;border-radius:10px;background:var(--surface-3);font:500 12px var(--fk);color:var(--text-2)}
.tag.more{color:var(--dim)}
.rmini{padding:20px 24px;display:flex;align-items:center;gap:16px}
.rmini .sub{font:600 12px var(--f);color:var(--dim);margin-top:7px;font-variant-numeric:tabular-nums}

/* ── 통계 ── */
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;padding:4px;flex:none}
.seg button{height:34px;padding:0 14px;border-radius:10px;color:var(--dim);font:600 12.5px var(--fk);display:flex;align-items:center}
.seg button[aria-selected="true"]{background:var(--accent);color:#0B0C0E;font-weight:700}
.vol{display:flex;align-items:center;gap:12px}
.vol .n{font:600 12px var(--fk);color:var(--muted);width:34px;flex:none}
.vol .t{flex:1;height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:block}
.vol .t i{display:block;height:14px;background:var(--accent);border-radius:4px}
.vol .v{font:400 12px var(--f);color:var(--text-2);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.statgrid{display:flex;gap:10px;flex-wrap:wrap}
.statgrid .card{flex:1 1 84px;padding:16px 18px;min-width:0}
.statgrid .v{font:800 24px var(--f);margin-top:6px;font-variant-numeric:tabular-nums}
.delta{font:700 12px var(--f);color:var(--accent)}
.delta.down{color:#E0674A}

/* ── 시트 ── */
.sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.62);align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheetin{
  width:100%;max-width:430px;max-height:88dvh;overflow-y:auto;
  background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:20px var(--pad) calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheeth{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheeth h2{font:800 22px var(--f);letter-spacing:-.02em;margin:0}
.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font:600 10.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{
  height:52px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);
  padding:0 16px;font:500 15px var(--fk);color:var(--text);width:100%;
}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld input.n{font:800 20px var(--f);text-align:center;padding:0 8px;font-variant-numeric:tabular-nums}
.f3{display:flex;gap:8px}
.f3 .fld{flex:1;min-width:0}
.eitem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.eitem .n{flex:1;min-width:0;font:500 14px var(--fk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem .s{font:400 13px var(--f);color:var(--muted);font-variant-numeric:tabular-nums}
.eitem .rm{width:32px;height:32px;border-radius:10px;color:var(--dim);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.empty{padding:38px 20px;text-align:center;font:500 14px/1.7 var(--fk);color:var(--dim)}
.empty b{display:block;font:700 18px var(--fk);color:var(--text-2);margin-bottom:8px}
.toast{
  position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(12px);
  z-index:80;background:var(--accent);color:#0B0C0E;border-radius:14px;
  padding:12px 20px;font:700 14px var(--fk);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ── 홈 ── -->
  <div class="scr on" id="s-home">
    <div class="shd">
      <div>
        <div class="lbl" id="homeDate"></div>
        <div class="greet" id="homeGreet">오늘도 밀어봅시다</div>
      </div>
      <button class="icobtn" id="goSettings" aria-label="설정">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B6BCC2" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
      </button>
    </div>

    <div class="card hi streak">
      <div class="ring">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="41" fill="none" stroke="#23272C" stroke-width="7"></circle>
          <circle id="ringArc" cx="48" cy="48" r="41" fill="none" stroke="#C8FF3D" stroke-width="7"
                  stroke-linecap="round" stroke-dasharray="258" stroke-dashoffset="258"></circle>
        </svg>
        <div class="in"><span class="n" id="streakN">0</span><span class="u">일 연속</span></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:12px;min-width:0">
        <div class="lbl">스트릭</div>
        <div style="font:500 13px/1.5 var(--fk);color:var(--text-2)" id="streakMsg"></div>
        <div class="dots" id="streakDots"></div>
      </div>
    </div>

    <div class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px" id="todayCard"></div>

    <div class="card" style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <div class="lbl">이번 주</div>
        <div><span class="num" style="font:800 26px var(--f)" id="wkDone">0</span><span class="num" style="font:600 15px var(--f);color:var(--dimmer)"> / <span id="wkGoal">5</span>회</span></div>
      </div>
      <div class="wk" id="wkBars"></div>
    </div>

    <div id="homeRecent"></div>
  </div>

  <!-- ── 기록(세션) ── -->
  <div class="scr" id="s-log"></div>

  <!-- ── 루틴 ── -->
  <div class="scr" id="s-routine">
    <div class="shd">
      <div class="stitle">루틴</div>
      <button class="btn sm" style="width:auto;padding:0 18px;height:44px;border-radius:14px;font-size:14px" id="newRoutine">+ 새 루틴</button>
    </div>
    <div class="pillrow" id="splitBar"></div>
    <div id="routineList" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <!-- ── 통계 ── -->
  <div class="scr" id="s-stat">
    <div class="shd">
      <div class="stitle">통계</div>
      <div class="seg" id="rangeSeg">
        <button data-r="90" aria-selected="true">3개월</button>
        <button data-r="365" aria-selected="false">1년</button>
      </div>
    </div>
    <div id="statBody" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <nav class="tabs" id="tabbar" role="tablist">
    <button class="tab" role="tab" data-s="home" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11.5 12 5l8 6.5V20H4z"/></svg>홈</button>
    <button class="tab" role="tab" data-s="log" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h2M18 12h2M7 8v8M17 8v8M7 12h10"/></svg>기록<span class="live" id="liveDot" hidden></span></button>
    <button class="tab" role="tab" data-s="routine" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>루틴</button>
    <button class="tab" role="tab" data-s="stat" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19V11M12 19V6M19 19v-5"/></svg>통계</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="sheetin" id="sheetin"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ══ 저장 ══════════════════════════════════════════════ */
  var KEY = 'gymlog_v1';
  var OLD = 'onemonth_v1';           // 기록장(index.html)의 저장 키

  var PARTS = ['가슴', '등', '하체', '어깨', '팔', '코어'];

  // 종목 이름에서 부위를 추정합니다. 통계의 부위별 볼륨에 씁니다.
  var PART_HINT = [
    ['가슴', /벤치|체스트|플라이|딥스|푸시업|프레스\s*업|인클라인|디클라인|펙덱/],
    ['등',   /랫|풀다운|로우|풀업|친업|데드리프트|시티드\s*로|바벨\s*로|티바|슈러그/],
    ['하체', /스쿼트|스퀘트|레그|런지|카프|힙\s*쓰러스트|데드\s*리프트|루마니안/],
    ['어깨', /숄더|오버헤드|레터럴|사이드|프론트\s*레이즈|리어\s*델트|페이스\s*풀|업라이트/],
    ['팔',   /컬|익스텐션|트라이|이두|삼두|킥백|푸시\s*다운|해머/],
    ['코어', /크런치|플랭크|레그\s*레이즈|앱|복근|러시안/]
  ];
  function guessPart(name) {
    for (var i = 0; i < PART_HINT.length; i++) if (PART_HINT[i][1].test(name)) return PART_HINT[i][0];
    return '가슴';
  }

  var DEFAULT_ROUTINES = [
    { id: 'r1', name: 'PUSH', sub: '가슴 · 삼두 · 어깨', split: '3분할', archived: false, items: [
      { name: '벤치프레스', part: '가슴', sets: 5, reps: 8, w: 60 },
      { name: '인클라인 덤벨 프레스', part: '가슴', sets: 3, reps: 12, w: 24 },
      { name: '케이블 플라이', part: '가슴', sets: 3, reps: 15, w: 15 },
      { name: '숄더 프레스', part: '어깨', sets: 4, reps: 10, w: 30 },
      { name: '트라이셉스 푸시다운', part: '팔', sets: 3, reps: 12, w: 25 }
    ]},
    { id: 'r2', name: 'PULL', sub: '등 · 이두', split: '3분할', archived: false, items: [
      { name: '랫 풀다운', part: '등', sets: 4, reps: 10, w: 50 },
      { name: '바벨 로우', part: '등', sets: 4, reps: 8, w: 60 },
      { name: '시티드 로우', part: '등', sets: 3, reps: 12, w: 45 },
      { name: '페이스 풀', part: '어깨', sets: 3, reps: 15, w: 20 },
      { name: '바벨 컬', part: '팔', sets: 3, reps: 10, w: 25 },
      { name: '해머 컬', part: '팔', sets: 3, reps: 12, w: 14 }
    ]},
    { id: 'r3', name: 'LEGS', sub: '하체 · 코어', split: '3분할', archived: false, items: [
      { name: '스쿼트', part: '하체', sets: 5, reps: 8, w: 80 },
      { name: '레그 프레스', part: '하체', sets: 4, reps: 12, w: 120 },
      { name: '루마니안 데드리프트', part: '하체', sets: 3, reps: 10, w: 70 },
      { name: '레그 익스텐션', part: '하체', sets: 3, reps: 15, w: 40 },
      { name: '행잉 레그 레이즈', part: '코어', sets: 3, reps: 15, w: 0 }
    ]}
  ];

  var db = {
    routines: [], sessions: [], active: null, goal: 5,
    split: '3분할', range: 90, imported: false
  };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var v = JSON.parse(raw);
        if (v && typeof v === 'object') {
          db.routines = Array.isArray(v.routines) ? v.routines : [];
          db.sessions = Array.isArray(v.sessions) ? v.sessions : [];
          db.active = v.active || null;
          db.goal = v.goal || 5;
          db.split = v.split || '3분할';
          db.imported = !!v.imported;
        }
      }
    } catch (e) { /* 손상된 저장본은 무시하고 새로 시작합니다 */ }

    if (!db.routines.length) db.routines = JSON.parse(JSON.stringify(DEFAULT_ROUTINES));
    if (!db.imported) importFromNotebook();
  }

  var saveTimer = null;
  function flush() {
    clearTimeout(saveTimer); saveTimer = null;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 120);
  }
  // 화면을 벗어나거나 앱이 닫힐 때는 기다리지 않고 바로 씁니다.
  // 헬스장에서 화면이 꺼지는 일이 잦아 마지막 세트가 날아가면 안 됩니다.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flush();
  });
  window.addEventListener('pagehide', flush);

  /* 기록장(index.html)에 이미 쌓인 세트를 한 번만 지난 세션으로 가져옵니다.
     같은 오리진이라 그대로 읽을 수 있고, 원본은 건드리지 않습니다. */
  function importFromNotebook() {
    db.imported = true;
    var raw = null;
    try { raw = localStorage.getItem(OLD); } catch (e) { return; }
    if (!raw) return;
    var old;
    try { old = JSON.parse(raw); } catch (e) { return; }
    if (!old || !old.ex) return;

    var PMAP = { sh: '어깨', bk: '등', ch: '가슴', lg: '하체', tri: '팔', bi: '팔' };
    var byDate = {};
    Object.keys(old.ex).forEach(function (pk) {
      (old.ex[pk] || []).forEach(function (x) {
        (x.s || []).forEach(function (s) {
          if (!s || !s.t) return;
          var d = byDate[s.t] || (byDate[s.t] = {});
          var e = d[x.n] || (d[x.n] = { name: x.n, part: PMAP[pk] || guessPart(x.n), sets: [] });
          e.sets.push({ w: +s.w || 0, r: +s.r || 0, done: true });
        });
      });
    });

    var dates = Object.keys(byDate).sort();
    if (!dates.length) return;
    dates.forEach(function (d) {
      var ex = Object.keys(byDate[d]).map(function (n) { return byDate[d][n]; });
      db.sessions.push({
        id: 'imp-' + d, date: d, routineId: null,
        name: '기록장', sub: ex.length + '종목',
        start: null, end: null, dur: 0, ex: ex
      });
    });
    toast(dates.length + '일치 기록을 기록장에서 가져왔습니다');
  }

  /* ══ 날짜 · 계산 ═══════════════════════════════════════ */
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function parse(t) { var p = String(t).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
  function ago(t) {
    var g = daysBetween(t, today());
    if (g <= 0) return '오늘';
    if (g === 1) return '어제';
    if (g < 7) return g + '일 전';
    if (g < 28) return Math.floor(g / 7) + '주 전';
    return Math.floor(g / 30) + '달 전';
  }
  function mmss(t) { return pad(Math.floor(t / 60)) + ':' + pad(t % 60); }
  function hms(t) { return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t / 60) % 60) + ':' + pad(t % 60); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function volOf(ses) {
    var v = 0;
    (ses.ex || []).forEach(function (e) {
      (e.sets || []).forEach(function (s) { if (s.done) v += (+s.w || 0) * (+s.r || 0); });
    });
    return v;
  }
  function setsOf(ses) {
    var n = 0;
    (ses.ex || []).forEach(function (e) {
      (e.sets || []).forEach(function (s) { if (s.done) n++; });
    });
    return n;
  }
  // Epley 공식 — 1RM 추정
  function orm(w, r) { return r <= 1 ? w : w * (1 + r / 30); }

  function sessionDates() {
    var seen = {};
    db.sessions.forEach(function (s) { if (setsOf(s)) seen[s.date] = 1; });
    return Object.keys(seen).sort();
  }

  // 연속 일수 — 오늘 안 했으면 어제부터 셉니다(하루는 봐줍니다).
  function streak() {
    var set = {};
    sessionDates().forEach(function (d) { set[d] = 1; });
    var cur = new Date();
    if (!set[ymd(cur)]) cur.setDate(cur.getDate() - 1);
    var n = 0;
    while (set[ymd(cur)]) { n++; cur.setDate(cur.getDate() - 1); }
    return n;
  }
  function bestStreak() {
    var ds = sessionDates(), best = 0, run = 0;
    for (var i = 0; i < ds.length; i++) {
      run = (i && daysBetween(ds[i - 1], ds[i]) === 1) ? run + 1 : 1;
      if (run > best) best = run;
    }
    return best;
  }
  // 이번 주(월요일 시작) 요일별 볼륨
  function weekVols() {
    var now = new Date();
    var mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    var out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon); d.setDate(mon.getDate() + i);
      var key = ymd(d), v = 0;
      db.sessions.forEach(function (s) { if (s.date === key) v += volOf(s); });
      out.push({ d: WD[d.getDay()], v: v, key: key });
    }
    return out;
  }

  /* ══ 화면 전환 ═════════════════════════════════════════ */
  var screen = 'home';
  function $(id) { return document.getElementById(id); }

  function go(name) {
    screen = name;
    ['home', 'log', 'routine', 'stat'].forEach(function (s) {
      $('s-' + s).classList.toggle('on', s === name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#tabbar .tab'), function (t) {
      t.setAttribute('aria-selected', t.dataset.s === name ? 'true' : 'false');
    });
    window.scrollTo(0, 0);
    render();
  }
  $('tabbar').addEventListener('click', function (e) {
    var t = e.target.closest('.tab'); if (t) go(t.dataset.s);
  });

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }

  /* ══ 홈 ════════════════════════════════════════════════ */
  function todayRoutine() {
    // 오늘 예정 = 활성 분할 중 가장 오래 안 한 루틴
    var pool = db.routines.filter(function (r) { return !r.archived && r.split === db.split; });
    if (!pool.length) pool = db.routines.filter(function (r) { return !r.archived; });
    if (!pool.length) return null;
    var lastOf = {};
    db.sessions.forEach(function (s) {
      if (s.routineId && (!lastOf[s.routineId] || s.date > lastOf[s.routineId])) lastOf[s.routineId] = s.date;
    });
    pool.sort(function (a, b) { return (lastOf[a.id] || '') < (lastOf[b.id] || '') ? -1 : 1; });
    return pool[0];
  }

  function renderHome() {
    var now = new Date();
    $('homeDate').textContent =
      now.getFullYear() + '. ' + pad(now.getMonth() + 1) + '. ' + pad(now.getDate()) +
      ' ' + WD[now.getDay()] + '요일';

    var st = streak(), best = bestStreak();
    $('streakN').textContent = st;
    var goal = Math.max(best, 7);
    $('ringArc').setAttribute('stroke-dashoffset', String(Math.max(0, 258 - 258 * Math.min(1, st / goal))));
    $('streakMsg').innerHTML = st === 0
      ? '오늘 한 세트만 넣어도 시작됩니다'
      : (st >= best
        ? '최고 기록을 <span style="color:var(--accent);font-weight:700">갱신 중</span>입니다'
        : '최고 기록 ' + best + '일까지 <span style="color:var(--accent);font-weight:700">' + (best - st) + '일</span> 남았어요');

    var wv = weekVols(), dots = '';
    wv.forEach(function (d) { dots += '<i class="' + (d.v > 0 ? 'on' : '') + '"></i>'; });
    $('streakDots').innerHTML = dots;

    var done = wv.filter(function (d) { return d.v > 0; }).length;
    $('wkDone').textContent = done;
    $('wkGoal').textContent = db.goal;
    var max = Math.max.apply(null, wv.map(function (d) { return d.v; }).concat([1]));
    $('wkBars').innerHTML = wv.map(function (d) {
      var h = d.v > 0 ? Math.max(12, Math.round(40 * d.v / max)) : 14;
      return '<div><span class="b' + (d.v > 0 ? ' on' : '') + '" style="height:' + h + 'px"></span>' +
        '<span class="d">' + d.d + '</span></div>';
    }).join('');

    // 오늘의 루틴 / 진행 중 세션
    var card = $('todayCard');
    if (db.active) {
      var a = db.active;
      var doneN = 0, totN = 0;
      a.ex.forEach(function (e) { e.sets.forEach(function (s) { totN++; if (s.done) doneN++; }); });
      card.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:space-between">' +
          '<div class="lbl" style="color:var(--accent)">진행 중</div>' +
          '<div style="font:600 11px var(--fk);color:var(--muted)">' + doneN + ' / ' + totN + ' 세트</div></div>' +
        '<div class="rname">' + esc(a.name) + ' <s>' + esc(a.sub || '') + '</s></div>' +
        '<button class="btn" data-act="resume">이어서 하기</button>';
      return;
    }

    var r = todayRoutine();
    if (!r) {
      card.innerHTML =
        '<div class="lbl">오늘의 루틴</div>' +
        '<div style="font:500 14px/1.7 var(--fk);color:var(--dim)">루틴이 없습니다. 먼저 하나 만드세요.</div>' +
        '<button class="btn" data-act="mkroutine">+ 새 루틴</button>';
      return;
    }
    var totalSets = r.items.reduce(function (a2, i) { return a2 + i.sets; }, 0);
    card.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between">' +
        '<div class="lbl">오늘의 루틴</div>' +
        '<div style="font:600 11px var(--fk);color:var(--muted)">' + r.items.length + '종목 · 예상 ' +
          Math.max(12, totalSets * 3 + r.items.length * 2) + '분</div></div>' +
      '<div class="rname">' + esc(r.name) + ' <s>' + esc(r.sub) + '</s></div>' +
      '<div style="display:flex;flex-direction:column;gap:2px">' +
        r.items.slice(0, 3).map(function (i, k) {
          return '<div class="exrow"><span class="i">' + pad(k + 1) + '</span>' +
            '<span class="n">' + esc(i.name) + '</span>' +
            '<span class="s">' + i.sets + ' × ' + i.reps + '</span></div>';
        }).join('') +
        (r.items.length > 3
          ? '<div class="exrow"><span class="i"></span><span class="n" style="color:var(--dim)">외 ' +
            (r.items.length - 3) + '종목</span></div>' : '') +
      '</div>' +
      '<button class="btn" data-act="start" data-id="' + r.id + '">운동 시작</button>';

    // 최근 기록
    var recent = db.sessions.filter(function (s) { return setsOf(s); })
      .sort(function (a2, b) { return a2.date < b.date ? 1 : -1; }).slice(0, 3);
    $('homeRecent').innerHTML = !recent.length ? '' :
      '<div class="card" style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">' +
      '<div class="lbl">최근 기록</div>' +
      recent.map(function (s) {
        return '<div class="exrow"><span class="n">' + esc(s.name) + '</span>' +
          '<span class="s">' + Math.round(volOf(s)).toLocaleString('ko-KR') + 'kg</span>' +
          '<span class="s" style="color:var(--dimmer);width:52px;text-align:right">' + ago(s.date) + '</span></div>';
      }).join('') + '</div>';
  }

  $('s-home').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act;
    if (a === 'start') startSession(b.dataset.id);
    else if (a === 'resume') go('log');
    else if (a === 'mkroutine') { go('routine'); openRoutineEditor(null); }
  });
  $('goSettings').addEventListener('click', openSettings);

  /* ══ 세션 ══════════════════════════════════════════════ */
  function startSession(routineId) {
    if (db.active && !confirm('진행 중인 운동이 있습니다. 새로 시작하면 지금 것은 저장하고 끝냅니다.')) return;
    if (db.active) endSession(true);

    var r = db.routines.filter(function (x) { return x.id === routineId; })[0];
    if (!r) return;
    db.active = {
      id: 'ses-' + Date.now(), routineId: r.id, name: r.name, sub: r.sub,
      date: today(), start: Date.now(), rest: 0, restUntil: 0,
      ex: r.items.map(function (i) {
        var sets = [];
        for (var k = 0; k < i.sets; k++) sets.push({ w: i.w, r: i.reps, done: false });
        return { name: i.name, part: i.part || guessPart(i.name), meta: (i.part || guessPart(i.name)) + ' · 목표 ' + i.sets + '세트', sets: sets };
      })
    };
    save(); go('log');
  }

  function endSession(silent) {
    var a = db.active; if (!a) return;
    var n = setsOf(a);
    if (n) {
      db.sessions.push({
        id: a.id, date: a.date, routineId: a.routineId, name: a.name, sub: a.sub,
        start: a.start, end: Date.now(), dur: Math.round((Date.now() - a.start) / 1000),
        ex: a.ex.map(function (e) {
          return { name: e.name, part: e.part, sets: e.sets.filter(function (s) { return s.done; }) };
        }).filter(function (e) { return e.sets.length; })
      });
    }
    db.active = null; save();
    if (!silent) {
      toast(n ? n + '세트 저장했습니다' : '기록한 세트가 없어 저장하지 않았습니다');
      go('home');
    }
  }

  function activeIndex() {
    var a = db.active; if (!a) return null;
    for (var i = 0; i < a.ex.length; i++) {
      for (var j = 0; j < a.ex[i].sets.length; j++) if (!a.ex[i].sets[j].done) return { e: i, s: j };
    }
    return null;
  }

  function renderLog() {
    var el = $('s-log');
    var a = db.active;
    $('liveDot').hidden = !a;

    if (!a) {
      var r = todayRoutine();
      el.innerHTML =
        '<div class="shd"><div class="stitle">기록</div></div>' +
        '<div class="card"><div class="empty"><b>진행 중인 운동이 없습니다</b>' +
        '루틴을 골라 시작하면 세트를 하나씩 체크하며<br>휴식 타이머가 자동으로 돕니다.</div></div>' +
        (r ? '<button class="btn" data-act="start" data-id="' + r.id + '">' + esc(r.name) + ' 시작</button>' : '') +
        '<button class="btn2 tall" data-act="toroutine">루틴 고르기</button>';
      return;
    }

    var elapsed = Math.floor((Date.now() - a.start) / 1000);
    var restLeft = a.restUntil ? Math.max(0, Math.round((a.restUntil - Date.now()) / 1000)) : 0;
    var resting = restLeft > 0;
    var cur = activeIndex();

    el.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0;gap:12px">' +
        '<div><div class="lbl">' + esc(a.name) + ' · 진행 중</div>' +
        '<div class="timer" id="elapsed">' + hms(elapsed) + '</div></div>' +
        '<button class="icobtn solid" data-act="end" aria-label="운동 종료" style="width:48px;height:48px;border-radius:16px">' +
          '<span style="width:4px;height:16px;background:#F2F4F5;border-radius:1px;display:block"></span>' +
          '<span style="width:4px;height:16px;background:#F2F4F5;border-radius:1px;display:block;margin-left:4px"></span>' +
        '</button></div>' +

      '<div class="card rest" data-on="' + (resting ? 1 : 0) + '" id="restCard">' +
        '<div style="flex:1;min-width:0"><div class="lbl">휴식 타이머</div>' +
        '<div class="t" id="restT">' + (resting ? mmss(restLeft) : '휴식 대기') + '</div></div>' +
        '<div style="display:flex;gap:8px">' +
          '<button class="sq" data-act="rest+">+30</button>' +
          '<button class="sq" data-act="rest-" aria-label="휴식 건너뛰기">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F4F5" stroke-width="2.2" stroke-linecap="round"><path d="M6 5l9 7-9 7zM18 5v14"/></svg>' +
          '</button></div></div>' +

      '<div style="display:flex;flex-direction:column;gap:12px">' +
      a.ex.map(function (e, ei) {
        var doneN = e.sets.filter(function (s) { return s.done; }).length;
        return '<div class="card excard">' +
          '<div class="exhd"><div><div class="n">' + esc(e.name) + '</div>' +
            '<div class="lbl" style="margin-top:5px">' + esc(e.meta || e.part) + '</div></div>' +
            '<div class="num" style="font:600 13px var(--f);color:var(--muted)">' + doneN + ' / ' + e.sets.length + '</div></div>' +
          '<div class="bar"><i style="width:' + Math.round(doneN / e.sets.length * 100) + '%"></i></div>' +
          '<div class="sets">' +
          e.sets.map(function (s, si) {
            var st = s.done ? 'done' : (cur && cur.e === ei && cur.s === si ? 'active' : 'idle');
            return '<div class="setrow" data-st="' + st + '">' +
              '<button class="edit" data-act="editset" data-e="' + ei + '" data-s="' + si + '"' +
                ' aria-label="' + (si + 1) + '번째 세트 무게와 횟수 고치기">' +
                '<span class="no num">' + pad(si + 1) + '</span>' +
                '<span class="v num">' + s.w + '</span><span class="u">kg</span>' +
                '<span class="x">×</span>' +
                '<span class="v num">' + s.r + '</span>' +
              '</button>' +
              '<button class="chip" data-act="tap" data-e="' + ei + '" data-s="' + si + '" aria-label="세트 완료">' +
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' +
              '</button></div>';
          }).join('') +
          '</div>' +
          '<div style="display:flex;gap:8px">' +
            '<button class="btn2" data-act="addset" data-e="' + ei + '" style="height:40px;border-radius:12px;font-size:13px">세트 추가</button>' +
            '<button class="btn2" data-act="rmset" data-e="' + ei + '" style="height:40px;border-radius:12px;font-size:13px;flex:0 0 84px">세트 −</button>' +
          '</div>' +
        '</div>';
      }).join('') +
      '</div>' +

      '<div class="sesfoot">' +
        '<button class="btn2 tall" data-act="addex">종목 추가</button>' +
        '<button class="btn" data-act="end">운동 종료</button>' +
      '</div>';
  }

  $('s-log').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, a = db.active;
    var ei = +b.dataset.e, si = +b.dataset.s;

    if (act === 'start') { startSession(b.dataset.id); return; }
    if (act === 'toroutine') { go('routine'); return; }
    if (!a) return;

    if (act === 'tap') {
      var s = a.ex[ei].sets[si];
      s.done = !s.done;
      if (s.done) { a.rest = 90; a.restUntil = Date.now() + 90000; }
      save(); renderLog(); return;
    }
    if (act === 'editset') { openSetEditor(ei, si); return; }
    if (act === 'rest+') {
      var base = a.restUntil > Date.now() ? a.restUntil : Date.now();
      a.restUntil = base + 30000; save(); renderLog(); return;
    }
    if (act === 'rest-') { a.restUntil = 0; save(); renderLog(); return; }
    if (act === 'addset') {
      var sets = a.ex[ei].sets, last = sets[sets.length - 1] || { w: 20, r: 10 };
      sets.push({ w: last.w, r: last.r, done: false });
      save(); renderLog(); return;
    }
    if (act === 'rmset') {
      var ss = a.ex[ei].sets;
      for (var i = ss.length - 1; i >= 0; i--) {
        if (!ss[i].done) { ss.splice(i, 1); break; }
      }
      if (!ss.length) a.ex.splice(ei, 1);
      save(); renderLog(); return;
    }
    if (act === 'addex') { openAddExercise(); return; }
    if (act === 'end') {
      if (confirm('운동을 끝내고 기록을 저장할까요?')) endSession(false);
      return;
    }
  });

  // 1초 틱 — 진행 시간과 휴식만 갱신합니다(전체 렌더 대신 텍스트만 바꿉니다).
  setInterval(function () {
    var a = db.active; if (!a || screen !== 'log') return;
    var t = $('elapsed'); if (t) t.textContent = hms(Math.floor((Date.now() - a.start) / 1000));
    var rt = $('restT'), rc = $('restCard');
    if (!rt || !rc) return;
    var left = a.restUntil ? Math.max(0, Math.round((a.restUntil - Date.now()) / 1000)) : 0;
    if (left > 0) {
      rt.textContent = mmss(left);
      rc.dataset.on = '1';
    } else {
      if (rc.dataset.on === '1') { toast('휴식 끝 — 다음 세트'); a.restUntil = 0; save(); }
      rt.textContent = '휴식 대기';
      rc.dataset.on = '0';
    }
  }, 1000);

  /* ══ 루틴 ══════════════════════════════════════════════ */
  function splits() {
    var s = {};
    db.routines.forEach(function (r) { if (!r.archived) s[r.split || '3분할'] = 1; });
    var list = Object.keys(s);
    if (!list.length) list = ['3분할'];
    return list;
  }

  function renderRoutine() {
    var list = splits();
    if (list.indexOf(db.split) < 0) db.split = list[0];
    $('splitBar').innerHTML =
      list.map(function (s) {
        return '<button class="pill" data-split="' + esc(s) + '" aria-selected="' +
          (s === db.split ? 'true' : 'false') + '">' + esc(s) + '</button>';
      }).join('') +
      '<button class="pill" data-split="__arch" aria-selected="' +
        (db.split === '__arch' ? 'true' : 'false') + '">보관함</button>';

    var arch = db.split === '__arch';
    var rows = db.routines.filter(function (r) {
      return arch ? r.archived : (!r.archived && r.split === db.split);
    });

    var lastOf = {};
    db.sessions.forEach(function (s) {
      if (s.routineId && (!lastOf[s.routineId] || s.date > lastOf[s.routineId])) lastOf[s.routineId] = s.date;
    });
    var todays = todayRoutine();

    if (!rows.length) {
      $('routineList').innerHTML =
        '<div class="card"><div class="empty"><b>' + (arch ? '보관한 루틴이 없습니다' : '루틴이 없습니다') + '</b>' +
        (arch ? '쓰지 않는 루틴을 보관하면 여기 모입니다.' : '오른쪽 위 + 새 루틴으로 하나 만드세요.') + '</div></div>';
      return;
    }

    $('routineList').innerHTML = rows.map(function (r, idx) {
      var setsN = r.items.reduce(function (a, i) { return a + i.sets; }, 0);
      var last = lastOf[r.id] ? ago(lastOf[r.id]) : '없음';
      var isToday = !arch && todays && todays.id === r.id;
      var editBtn =
        '<button class="icobtn' + (isToday ? ' solid' : '') + '" data-act="edit" data-id="' + r.id + '" aria-label="루틴 편집">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B6BCC2" stroke-width="2" stroke-linecap="round"><path d="M4 20h4l10-10-4-4L4 16zM14 6l4 4"/></svg></button>';

      if (isToday || (idx === 0 && arch)) {
        return '<div class="card' + (isToday ? ' hi' : '') + ' rcard">' +
          '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">' +
            '<div><div style="display:flex;align-items:baseline;gap:10px">' +
              '<span style="font:800 26px var(--f);letter-spacing:-.03em">' + esc(r.name) + '</span>' +
              '<span style="font:600 13px var(--fk);color:var(--muted)">' + esc(r.sub) + '</span></div>' +
              (isToday ? '<div class="lbl" style="margin-top:8px;color:var(--accent)">오늘 예정</div>' : '') +
            '</div>' + editBtn + '</div>' +
          '<div class="rmeta">' +
            '<div><div class="lbl">종목</div><div class="v">' + r.items.length + '</div></div>' +
            '<div><div class="lbl">총 세트</div><div class="v">' + setsN + '</div></div>' +
            '<div><div class="lbl">최근 수행</div><div class="v" style="font-size:' +
              (last.length > 4 ? '16px' : '22px') + '">' + last + '</div></div>' +
          '</div>' +
          '<div class="tags">' +
            r.items.slice(0, 4).map(function (i) { return '<span class="tag">' + esc(i.name) + '</span>'; }).join('') +
            (r.items.length > 4 ? '<span class="tag more">+' + (r.items.length - 4) + '</span>' : '') +
          '</div>' +
          (arch
            ? '<button class="btn2" data-act="unarchive" data-id="' + r.id + '">보관 해제</button>'
            : '<button class="btn" data-act="start" data-id="' + r.id + '">운동 시작</button>') +
        '</div>';
      }
      return '<div class="card rmini">' +
        '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:10px">' +
          '<span style="font:800 22px var(--f);letter-spacing:-.03em">' + esc(r.name) + '</span>' +
          '<span style="font:600 12px var(--fk);color:var(--muted)">' + esc(r.sub) + '</span></div>' +
          '<div class="sub">' + r.items.length + '종목 · ' + setsN + '세트 · ' + last + '</div></div>' +
        editBtn + '</div>';
    }).join('') +
    (arch ? '' :
      '<button class="btn3" data-act="showarch">보관된 루틴 ' +
      db.routines.filter(function (r) { return r.archived; }).length + '개 보기</button>');
  }

  $('splitBar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-split]'); if (!b) return;
    db.split = b.dataset.split; save(); renderRoutine();
  });
  $('newRoutine').addEventListener('click', function () { openRoutineEditor(null); });
  $('s-routine').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, id = b.dataset.id;
    if (act === 'start') startSession(id);
    else if (act === 'edit') openRoutineEditor(id);
    else if (act === 'showarch') { db.split = '__arch'; save(); renderRoutine(); }
    else if (act === 'unarchive') {
      var r = db.routines.filter(function (x) { return x.id === id; })[0];
      if (r) { r.archived = false; db.split = r.split; save(); renderRoutine(); toast('보관을 해제했습니다'); }
    }
  });

  /* ══ 통계 ══════════════════════════════════════════════ */
  function inRange(s) {
    return daysBetween(s.date, today()) <= db.range;
  }

  function renderStat() {
    var rows = db.sessions.filter(function (s) { return setsOf(s) && inRange(s); });
    if (!rows.length) {
      $('statBody').innerHTML =
        '<div class="card"><div class="empty"><b>아직 기록이 없습니다</b>' +
        '운동을 한 번 끝내면 볼륨과 1RM 추이가 여기 쌓입니다.</div></div>';
      return;
    }

    // 주간 총 볼륨 — 최근 7일 vs 그 이전 7일
    var v7 = 0, v14 = 0;
    rows.forEach(function (s) {
      var g = daysBetween(s.date, today());
      if (g < 7) v7 += volOf(s);
      else if (g < 14) v14 += volOf(s);
    });
    var delta = v14 > 0 ? Math.round((v7 - v14) / v14 * 1000) / 10 : null;

    // 부위별 볼륨
    var byPart = {};
    rows.forEach(function (s) {
      (s.ex || []).forEach(function (e) {
        var p = e.part || guessPart(e.name);
        (e.sets || []).forEach(function (x) {
          if (x.done !== false) byPart[p] = (byPart[p] || 0) + (+x.w || 0) * (+x.r || 0);
        });
      });
    });
    var parts = Object.keys(byPart).sort(function (a, b) { return byPart[b] - byPart[a]; });
    var pmax = parts.length ? byPart[parts[0]] : 1;
    var shades = ['var(--accent)', 'var(--accent)', 'var(--accent-dim)', 'var(--accent-deep)', 'var(--accent-deepest)'];

    // 1RM 추이 — 기록이 가장 많은 종목
    var byEx = {};
    rows.forEach(function (s) {
      (s.ex || []).forEach(function (e) {
        var best = 0;
        (e.sets || []).forEach(function (x) {
          if (x.done === false) return;
          var o = orm(+x.w || 0, +x.r || 0);
          if (o > best) best = o;
        });
        if (!best) return;
        var arr = byEx[e.name] || (byEx[e.name] = []);
        arr.push({ t: s.date, v: best });
      });
    });
    var exNames = Object.keys(byEx).sort(function (a, b) { return byEx[b].length - byEx[a].length; });
    var pick = statEx && byEx[statEx] ? statEx : exNames[0];
    var series = (byEx[pick] || []).slice().sort(function (a, b) { return a.t < b.t ? -1 : 1; });

    var line = '';
    if (series.length >= 2) {
      var vs = series.map(function (p) { return p.v; });
      var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
      if (hi === lo) { hi = lo + 1; }
      var pts = series.map(function (p, i) {
        var x = 4 + (312 * i / (series.length - 1));
        var y = 112 - 100 * (p.v - lo) / (hi - lo);
        return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
      });
      var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0] + ' ' + p[1]; }).join(' ');
      line =
        '<svg viewBox="0 0 320 130" width="100%" height="130" preserveAspectRatio="none">' +
          '<line x1="0" y1="20" x2="320" y2="20" stroke="#1E2226"/>' +
          '<line x1="0" y1="65" x2="320" y2="65" stroke="#1E2226"/>' +
          '<line x1="0" y1="110" x2="320" y2="110" stroke="#1E2226"/>' +
          '<path d="' + d + '" fill="none" stroke="#C8FF3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="' + d + ' L' + pts[pts.length - 1][0] + ' 130 L' + pts[0][0] + ' 130 Z" fill="#C8FF3D" opacity=".08"/>' +
          '<circle cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1] + '" r="5" fill="#C8FF3D"/>' +
        '</svg>' +
        '<div style="display:flex;justify-content:space-between">' +
          '<span class="num" style="font-size:10.5px;color:var(--dimmer)">' + series[0].t.slice(5).replace('-', '/') + '</span>' +
          '<span class="num" style="font-size:10.5px;color:var(--dimmer)">' + series[series.length - 1].t.slice(5).replace('-', '/') + '</span>' +
        '</div>';
    } else {
      line = '<div style="font:500 13px/1.7 var(--fk);color:var(--dim);padding:14px 0">' +
        '이 종목은 아직 한 번만 기록됐습니다. 두 번 이상 쌓이면 추이가 그려집니다.</div>';
    }

    var cur1rm = series.length ? series[series.length - 1].v : 0;
    var first1rm = series.length ? series[0].v : 0;
    var gain = cur1rm - first1rm;
    var weeks = series.length >= 2 ? Math.max(1, Math.round(daysBetween(series[0].t, series[series.length - 1].t) / 7)) : 0;

    // 상단 3개 요약
    var allDates = {};
    rows.forEach(function (s) { allDates[s.date] = 1; });
    var bigLifts = ['스쿼트', '데드', '벤치'];
    var cards = bigLifts.map(function (kw) {
      var best = 0;
      Object.keys(byEx).forEach(function (n) {
        if (n.indexOf(kw) < 0) return;
        byEx[n].forEach(function (p) { if (p.v > best) best = p.v; });
      });
      return { k: kw + ' 1RM', v: best ? Math.round(best) : '—' };
    });
    cards.push({ k: '총 세션', v: Object.keys(allDates).length });

    $('statBody').innerHTML =
      '<div class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:18px">' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">' +
          '<div class="lbl">주간 총 볼륨</div>' +
          '<div style="display:flex;align-items:baseline;gap:8px">' +
            '<span class="num" style="font:800 36px var(--f)">' + (Math.round(v7 / 100) / 10) + '</span>' +
            '<span style="font:600 13px var(--f);color:var(--dim)">t</span>' +
            (delta === null ? '' : '<span class="delta' + (delta < 0 ? ' down' : '') + '" style="margin-left:4px">' +
              (delta > 0 ? '+' : '') + delta + '%</span>') +
          '</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:12px">' +
        parts.slice(0, 6).map(function (p, i) {
          return '<div class="vol"><span class="n">' + esc(p) + '</span>' +
            '<span class="t"><i style="width:' + Math.max(4, Math.round(byPart[p] / pmax * 100)) + '%;background:' +
              (shades[i] || shades[shades.length - 1]) + '"></i></span>' +
            '<span class="v">' + (Math.round(byPart[p] / 100) / 10) + 't</span></div>';
        }).join('') +
        '</div></div>' +

      '<div class="card" style="padding:22px 24px 18px;display:flex;flex-direction:column;gap:14px">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">' +
          '<div style="min-width:0"><div class="lbl">1RM 추이</div>' +
            '<select id="exPick" style="margin-top:6px;height:auto;padding:0;background:none;border:none;font:700 16px var(--fk);color:var(--text);max-width:170px">' +
            exNames.map(function (n) {
              return '<option value="' + esc(n) + '"' + (n === pick ? ' selected' : '') + '>' + esc(n) + '</option>';
            }).join('') + '</select></div>' +
          '<div style="text-align:right;flex:none"><div class="num" style="font:800 34px var(--f);line-height:1">' +
            Math.round(cur1rm) + '<span style="font-size:14px;color:var(--dim);font-weight:600"> kg</span></div>' +
            (weeks ? '<div class="delta' + (gain < 0 ? ' down' : '') + '" style="margin-top:4px">' +
              (gain >= 0 ? '+' : '') + Math.round(gain) + ' kg / ' + weeks + '주</div>' : '') +
          '</div></div>' + line +
      '</div>' +

      '<div class="statgrid">' +
        cards.map(function (c) {
          return '<div class="card"><div class="lbl">' + esc(c.k) + '</div><div class="v num">' + c.v + '</div></div>';
        }).join('') +
      '</div>';

    var sel = $('exPick');
    if (sel) sel.addEventListener('change', function () { statEx = sel.value; renderStat(); });
  }
  var statEx = null;

  $('rangeSeg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-r]'); if (!b) return;
    db.range = +b.dataset.r;
    Array.prototype.forEach.call($('rangeSeg').children, function (c) {
      c.setAttribute('aria-selected', c === b ? 'true' : 'false');
    });
    save(); renderStat();
  });

  /* ══ 시트 ══════════════════════════════════════════════ */
  var sheet = $('sheet'), sheetin = $('sheetin');
  function openSheet(html) { sheetin.innerHTML = html; sheet.classList.add('on'); }
  function closeSheet() { sheet.classList.remove('on'); sheetin.innerHTML = ''; }
  sheet.addEventListener('click', function (e) {
    if (e.target === sheet || e.target.closest('[data-close]')) closeSheet();
  });

  var draft = null;   // 편집 중인 루틴

  function openRoutineEditor(id) {
    var r = id ? db.routines.filter(function (x) { return x.id === id; })[0] : null;
    draft = r
      ? JSON.parse(JSON.stringify(r))
      : { id: 'r' + Date.now(), name: '', sub: '', split: db.split === '__arch' ? '3분할' : db.split, archived: false, items: [] };
    drawEditor(!!r);
  }

  function drawEditor(isEdit) {
    openSheet(
      '<div class="sheeth"><h2>' + (isEdit ? '루틴 편집' : '새 루틴') + '</h2>' +
        '<button class="icobtn" data-close aria-label="닫기">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" stroke="#B6BCC2" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +

      '<div class="f3">' +
        '<div class="fld" style="flex:1"><label>이름</label>' +
          '<input id="rName" maxlength="16" placeholder="PUSH" value="' + esc(draft.name) + '"></div>' +
        '<div class="fld" style="flex:0 0 118px"><label>분할</label>' +
          '<input id="rSplit" maxlength="10" placeholder="3분할" value="' + esc(draft.split) + '"></div>' +
      '</div>' +
      '<div class="fld"><label>부위 설명</label>' +
        '<input id="rSub" maxlength="30" placeholder="가슴 · 삼두 · 어깨" value="' + esc(draft.sub) + '"></div>' +

      '<div class="lbl" style="margin-top:4px">종목 ' + draft.items.length + '개</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px" id="itemList">' +
        (draft.items.length
          ? draft.items.map(function (i, k) {
              return '<div class="eitem"><span class="n">' + esc(i.name) + '</span>' +
                '<span class="s">' + i.sets + '×' + i.reps + ' · ' + i.w + 'kg</span>' +
                '<button class="rm" data-rm="' + k + '" aria-label="종목 삭제">×</button></div>';
            }).join('')
          : '<div style="font:500 13px var(--fk);color:var(--dim);padding:6px 2px">아직 종목이 없습니다.</div>') +
      '</div>' +

      '<div class="fld"><label>종목 추가</label>' +
        '<input id="iName" maxlength="30" placeholder="벤치프레스"></div>' +
      '<div class="f3">' +
        '<div class="fld"><label>세트</label><input id="iSets" class="n" type="number" inputmode="numeric" min="1" max="20" value="4"></div>' +
        '<div class="fld"><label>횟수</label><input id="iReps" class="n" type="number" inputmode="numeric" min="1" max="50" value="10"></div>' +
        '<div class="fld"><label>무게</label><input id="iW" class="n" type="number" inputmode="decimal" min="0" step="2.5" value="40"></div>' +
      '</div>' +
      '<button class="btn2" id="addItem">+ 종목 넣기</button>' +

      '<div style="display:flex;gap:10px;margin-top:6px">' +
        (isEdit
          ? '<button class="btn2 tall" id="archiveR" style="flex:0 0 96px">' +
            (draft.archived ? '복구' : '보관') + '</button>' : '') +
        '<button class="btn" id="saveR" style="flex:1">저장</button>' +
      '</div>' +
      (isEdit ? '<button class="btn3" id="delR" style="height:48px;border-radius:14px">이 루틴 삭제</button>' : '')
    );

    sheetin.querySelectorAll('[data-rm]').forEach(function (b) {
      b.addEventListener('click', function () {
        draft.items.splice(+b.dataset.rm, 1); drawEditor(isEdit);
      });
    });

    $('addItem').addEventListener('click', function () {
      var n = $('iName').value.trim();
      if (!n) { $('iName').focus(); return; }
      draft.name = $('rName').value.trim();
      draft.sub = $('rSub').value.trim();
      draft.split = $('rSplit').value.trim() || '3분할';
      draft.items.push({
        name: n.slice(0, 30), part: guessPart(n),
        sets: Math.min(20, Math.max(1, +$('iSets').value || 4)),
        reps: Math.min(50, Math.max(1, +$('iReps').value || 10)),
        w: Math.max(0, +$('iW').value || 0)
      });
      drawEditor(isEdit);
    });

    $('saveR').addEventListener('click', function () {
      var name = $('rName').value.trim();
      if (!name) { $('rName').focus(); toast('루틴 이름을 넣어주세요'); return; }
      if (!draft.items.length) { toast('종목을 하나 이상 넣어주세요'); return; }
      draft.name = name.slice(0, 16);
      draft.sub = $('rSub').value.trim().slice(0, 30) ||
        draft.items.map(function (i) { return i.part; })
          .filter(function (p, k, arr) { return arr.indexOf(p) === k; }).join(' · ');
      draft.split = $('rSplit').value.trim().slice(0, 10) || '3분할';

      var idx = -1;
      db.routines.forEach(function (r, k) { if (r.id === draft.id) idx = k; });
      if (idx >= 0) db.routines[idx] = draft; else db.routines.push(draft);
      db.split = draft.archived ? db.split : draft.split;
      save(); closeSheet(); renderRoutine(); renderHome();
      toast(idx >= 0 ? '루틴을 저장했습니다' : '루틴을 만들었습니다');
    });

    var arch = $('archiveR');
    if (arch) arch.addEventListener('click', function () {
      draft.archived = !draft.archived;
      var idx = -1;
      db.routines.forEach(function (r, k) { if (r.id === draft.id) idx = k; });
      if (idx >= 0) db.routines[idx] = draft;
      save(); closeSheet(); renderRoutine();
      toast(draft.archived ? '보관함으로 옮겼습니다' : '보관을 해제했습니다');
    });

    var del = $('delR');
    if (del) del.addEventListener('click', function () {
      if (!confirm('이 루틴을 지울까요? 이미 기록된 운동은 남습니다.')) return;
      db.routines = db.routines.filter(function (r) { return r.id !== draft.id; });
      save(); closeSheet(); renderRoutine(); renderHome();
      toast('루틴을 지웠습니다');
    });
  }

  /* 세트 하나의 무게·횟수 고치기. 이후 세트에도 한 번에 반영할 수 있게 했습니다 —
     보통 한 종목 안에서 무게를 통째로 올리기 때문입니다. */
  function openSetEditor(ei, si) {
    var s = db.active.ex[ei].sets[si];
    var name = db.active.ex[ei].name;
    openSheet(
      '<div class="sheeth"><h2>' + pad(si + 1) + '세트</h2>' +
        '<button class="icobtn" data-close aria-label="닫기">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" stroke="#B6BCC2" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div style="font:500 13px var(--fk);color:var(--muted);margin-top:-6px">' + esc(name) + '</div>' +
      '<div class="f3">' +
        '<div class="fld"><label>무게 kg</label>' +
          '<div style="display:flex;gap:6px">' +
            '<button class="sq" data-step="-2.5" data-t="w">−</button>' +
            '<input id="eW" class="n" type="number" inputmode="decimal" min="0" step="2.5" value="' + s.w + '">' +
            '<button class="sq" data-step="2.5" data-t="w">+</button></div></div>' +
      '</div>' +
      '<div class="f3">' +
        '<div class="fld"><label>횟수</label>' +
          '<div style="display:flex;gap:6px">' +
            '<button class="sq" data-step="-1" data-t="r">−</button>' +
            '<input id="eR" class="n" type="number" inputmode="numeric" min="1" step="1" value="' + s.r + '">' +
            '<button class="sq" data-step="1" data-t="r">+</button></div></div>' +
      '</div>' +
      '<button class="btn" id="eOk">이 세트만 저장</button>' +
      '<button class="btn2 tall" id="eAll">이후 세트에도 적용</button>'
    );

    function val(id) { return $(id); }
    sheetin.querySelectorAll('[data-step]').forEach(function (b) {
      b.addEventListener('click', function () {
        var f = val(b.dataset.t === 'w' ? 'eW' : 'eR');
        var min = b.dataset.t === 'w' ? 0 : 1;
        var nv = (parseFloat(f.value) || 0) + parseFloat(b.dataset.step);
        f.value = Math.max(min, b.dataset.t === 'w' ? Math.round(nv * 10) / 10 : Math.round(nv));
      });
    });

    function read() {
      return {
        w: Math.max(0, parseFloat(val('eW').value) || 0),
        r: Math.max(1, parseInt(val('eR').value, 10) || 1)
      };
    }
    $('eOk').addEventListener('click', function () {
      var v = read(); s.w = v.w; s.r = v.r;
      save(); closeSheet(); renderLog();
    });
    $('eAll').addEventListener('click', function () {
      var v = read(), sets = db.active.ex[ei].sets;
      for (var k = si; k < sets.length; k++) {
        if (k === si || !sets[k].done) { sets[k].w = v.w; sets[k].r = v.r; }
      }
      save(); closeSheet(); renderLog();
      toast('이후 세트에 적용했습니다');
    });
  }

  function openAddExercise() {
    openSheet(
      '<div class="sheeth"><h2>종목 추가</h2>' +
        '<button class="icobtn" data-close aria-label="닫기">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" stroke="#B6BCC2" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="fld"><label>종목 이름</label><input id="aName" maxlength="30" placeholder="케이블 플라이"></div>' +
      '<div class="f3">' +
        '<div class="fld"><label>세트</label><input id="aSets" class="n" type="number" inputmode="numeric" min="1" max="20" value="3"></div>' +
        '<div class="fld"><label>횟수</label><input id="aReps" class="n" type="number" inputmode="numeric" min="1" max="50" value="12"></div>' +
        '<div class="fld"><label>무게</label><input id="aW" class="n" type="number" inputmode="decimal" min="0" step="2.5" value="20"></div>' +
      '</div>' +
      '<button class="btn" id="aOk">이 운동에 넣기</button>'
    );
    $('aOk').addEventListener('click', function () {
      var n = $('aName').value.trim();
      if (!n) { $('aName').focus(); return; }
      var sets = [], cnt = Math.min(20, Math.max(1, +$('aSets').value || 3));
      var reps = Math.min(50, Math.max(1, +$('aReps').value || 12));
      var w = Math.max(0, +$('aW').value || 0);
      for (var i = 0; i < cnt; i++) sets.push({ w: w, r: reps, done: false });
      var part = guessPart(n);
      db.active.ex.push({ name: n.slice(0, 30), part: part, meta: part + ' · 목표 ' + cnt + '세트', sets: sets });
      save(); closeSheet(); renderLog();
    });
  }

  function openSettings() {
    var n = db.sessions.length;
    openSheet(
      '<div class="sheeth"><h2>설정</h2>' +
        '<button class="icobtn" data-close aria-label="닫기">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" stroke="#B6BCC2" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="fld"><label>주간 목표 횟수</label>' +
        '<input id="setGoal" class="n" type="number" inputmode="numeric" min="1" max="7" value="' + db.goal + '"></div>' +
      '<div style="font:500 13px/1.7 var(--fk);color:var(--dim)">' +
        '세션 ' + n + '개 · 루틴 ' + db.routines.length + '개가 이 기기에 저장돼 있습니다.<br>' +
        '기록장(index.html)과는 별도로 저장되며, 처음 열 때 한 번 기존 운동 기록을 가져왔습니다.</div>' +
      '<button class="btn" id="okGoal">저장</button>' +
      '<button class="btn2 tall" id="expJson">기록 내보내기 (JSON 복사)</button>'
    );
    $('okGoal').addEventListener('click', function () {
      db.goal = Math.min(7, Math.max(1, +$('setGoal').value || 5));
      save(); closeSheet(); renderHome(); toast('저장했습니다');
    });
    $('expJson').addEventListener('click', function () {
      var txt = JSON.stringify(db);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(function () { toast('복사했습니다'); },
          function () { toast('복사에 실패했습니다'); });
      } else { toast('이 브라우저에서는 복사할 수 없습니다'); }
    });
  }

  /* ══ 렌더 ══════════════════════════════════════════════ */
  function render() {
    if (screen === 'home') renderHome();
    else if (screen === 'log') renderLog();
    else if (screen === 'routine') renderRoutine();
    else if (screen === 'stat') renderStat();
    $('liveDot').hidden = !db.active;
  }

  load();
  save();
  render();
  // 진행 중인 운동이 있으면 그 화면부터 엽니다.
  if (db.active) go('log');
})();
</script>
</body>
</html>
